name: Numerical and release checks

on: [push, pull_request, workflow_dispatch]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash -n code/preprocessing/run_fmriprep.sh
      - run: python code/encoding/test_numerics.py
      - run: python code/glm/test_numerics.py
      - run: python -m unittest discover -s tests -v
